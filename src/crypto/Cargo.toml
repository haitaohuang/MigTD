[package]
name = "crypto"
version = "0.1.0"
license = "BSD-2-Clause-Patent"
edition = "2021"

[dependencies]
async_io = { path = "../async/async_io" }
der = {version = "0.7.9", features = ["oid", "alloc", "derive"]}
pki-types = { package = "rustls-pki-types", version = "1" }
rust_std_stub = { path = "../std-support/rust-std-stub" }
rustls = { version = "0.23.46", default-features = false, features = ["custom-provider"], optional = true }
rustls-symcrypt = { workspace = true, optional = true }
symcrypt-core.workspace = true
spin = { version = "0.9.8", default-features = false, features = ["mutex", "spin_mutex"] }
sys_time = { path = "../std-support/sys_time" }
zeroize = "1.5.7"

[target.'cfg(not(target_os = "none"))'.dependencies]
symcrypt-core = { workspace = true, features = ["std"] }

[features]
default = ["rustls_impl"]
rustls = ["dep:rustls", "dep:rustls-symcrypt"]
rustls_impl = ["rustls"]
AzCVMEmu = []
