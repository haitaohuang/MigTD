[package]
name = "tdx-mock-data"
version = "0.1.0"
edition = "2021"
authors = ["Microsoft Corporation"]
description = "Mock TD quote and report data for testing"
license = "BSD-2-Clause-Patent"

[dependencies]
# Use the original tdx-tdcall for types
tdx-tdcall = { path = "../../td-shim/tdx-tdcall" }
log = { version = "0.4", default-features = false }
symcrypt-core = { git = "https://github.com/haitaohuang/rust-symcrypt-static", rev = "52a32af1703584dd0bcd688ed38cf561d470b9ef", default-features = false }

[target.'cfg(not(target_os = "none"))'.dependencies]
symcrypt-core = { git = "https://github.com/haitaohuang/rust-symcrypt-static", rev = "52a32af1703584dd0bcd688ed38cf561d470b9ef", default-features = false, features = ["std"] }

[features]
default = []

[lib]
name = "tdx_mock_data"
path = "src/lib.rs"
