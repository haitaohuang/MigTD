[workspace]

members = [
    "src/attestation",
    "src/crypto",
    "src/devices/pci",
    "src/devices/virtio",
    "src/devices/vsock",
    "src/devices/virtio_serial",
    "src/devices/vmcall_raw",
    "src/migtd",
    "src/policy",
    "src/async/async_io",
    "src/async/async_runtime",
    "tests/test-td-payload",
    "tools/migtd-hash",
    "tools/migtd-collateral-generator",
    "tools/migtd-policy-generator",
    "tools/servtd-collateral-generator",
    "tools/json-signer",
    "tools/migtd-policy-verifier",
    "xtask",
    ]

default-members = [
    "src/migtd",
    ]

exclude = [
    "deps/td-shim",
    "deps/rustls",
    "deps/td-shim-AzCVMEmu",
    "deps/spdm-rs/sys_time"
    ]

resolver = "2"

[workspace.dependencies]
symcrypt-core = { git = "https://github.com/haitaohuang/rust-symcrypt-static", rev = "52a32af1703584dd0bcd688ed38cf561d470b9ef", default-features = false, features = ["encoding"] }
rustls-symcrypt = { git = "https://github.com/haitaohuang/rust-symcrypt-static", rev = "52a32af1703584dd0bcd688ed38cf561d470b9ef", default-features = false }
spdm-crypto-symcrypt = { git = "https://github.com/haitaohuang/rust-symcrypt-static", rev = "52a32af1703584dd0bcd688ed38cf561d470b9ef", default-features = false }

# the profile used for `cargo build`
[profile.dev]
panic = "abort" # disable stack unwinding on panic
opt-level = "z"
lto = true
strip = true

# the profile used for `cargo build --release`
[profile.release]
panic = "abort" # disable stack unwinding on panic
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true

[patch.crates-io]
sys_time = { path = "src/std-support/sys_time" }

[patch."https://github.com/ccc-spdm-tools/spdm-rs"]
spdmlib = { path = "deps/spdm-rs/spdmlib" }
codec = { path = "deps/spdm-rs/codec" }
